services:
  api1: &api
    image: docker.io/rmoraes4/rinha-fraud-2026:v20260511-502a87e
    environment:
      - PORT=8000
      - KNN_K=5
      - IVF_NPROBE=3
      - IVF_MAX_CANDIDATES=1200
      - IVF_MAX_CANDIDATES_PER_LIST=400
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160M"

  api2:
    <<: *api

  lb:
    image: nginx:alpine
    restart: always
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30M"
